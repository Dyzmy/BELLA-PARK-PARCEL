<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101722">
<title>BELLA PARK | Reset Password</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#101722;color:#f5f1e8;font-family:Arial,sans-serif}.card{width:min(100%,440px);padding:32px;border:1px solid #b99555;border-radius:18px;background:#182333;box-shadow:0 20px 60px #0006}.mark{width:54px;height:54px;display:grid;place-items:center;border:1px solid #c6a56b;color:#e3c58e;font-weight:bold;margin-bottom:22px}.eyebrow{color:#c6a56b;font-size:11px;letter-spacing:2px}h1{font-size:27px;margin:10px 0}p{color:#c4cbd4;line-height:1.55}label{display:block;margin:20px 0 7px;color:#e6e0d5;font-size:13px}input{width:100%;padding:14px;border:1px solid #485568;border-radius:9px;background:#0f1824;color:#fff;font-size:16px}button{width:100%;margin-top:22px;padding:15px;border:0;border-radius:9px;background:#c6a56b;color:#111827;font-weight:bold;cursor:pointer}button:disabled{opacity:.6}.message{min-height:24px;font-size:13px;color:#e8c98f}.back{display:block;margin-top:18px;color:#e8c98f;text-align:center}
</style>
</head>
<body>
<main class="card">
<div class="mark">BP</div>
<div class="eyebrow">BELLA PARK · ACCOUNT SECURITY</div>
<h1>Lupa Password?</h1>
<p>Masukkan email yang didaftarkan pada akaun staf. Kami akan menghantar pautan selamat untuk menetapkan password baharu.</p>
<form id="request-form">
<label for="email">Email berdaftar</label>
<input id="email" type="email" autocomplete="email" placeholder="nama@email.com" required>
<button id="submit" type="submit">HANTAR PAUTAN RESET</button>
<p class="message" id="message" role="status"></p>
</form>
<a class="back" href="./">Kembali ke log masuk</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const client=window.supabase.createClient("https://xudgvklvdonsyjeendkj.supabase.co","sb_publishable_Q7mDg46N_FP9_bPdrsRSLQ_sJY28ppU");
const form=document.getElementById("request-form"),email=document.getElementById("email"),button=document.getElementById("submit"),message=document.getElementById("message");
const saved=new URLSearchParams(location.search).get("email");if(saved)email.value=saved;
form.addEventListener("submit",async e=>{
 e.preventDefault();button.disabled=true;button.textContent="MENGHANTAR...";message.textContent="Sedang menghantar permintaan...";
 try{
  const redirectTo=new URL("reset-password.html",location.href).href;
  const {error}=await client.auth.resetPasswordForEmail(email.value.trim(),{redirectTo});
  if(error)throw error;
  message.textContent="Jika email itu berdaftar, pautan reset telah diminta. Semak Inbox dan Spam.";
 }catch(err){message.textContent="Tidak dapat menghantar pautan: "+(err?.message||"Ralat sambungan.");}
 finally{button.disabled=false;button.textContent="HANTAR PAUTAN RESET";}
});
</script>
</body>
</html>

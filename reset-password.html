<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101722">
<title>BELLA PARK | Tetapkan Password</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#101722;color:#f5f1e8;font-family:Arial,sans-serif}.card{width:min(100%,440px);padding:32px;border:1px solid #b99555;border-radius:18px;background:#182333;box-shadow:0 20px 60px #0006}.mark{width:54px;height:54px;display:grid;place-items:center;border:1px solid #c6a56b;color:#e3c58e;font-weight:bold;margin-bottom:22px}.eyebrow{color:#c6a56b;font-size:11px;letter-spacing:2px}h1{font-size:27px;margin:10px 0}p{color:#c4cbd4;line-height:1.55}label{display:block;margin:18px 0 7px;color:#e6e0d5;font-size:13px}input{width:100%;padding:14px;border:1px solid #485568;border-radius:9px;background:#0f1824;color:#fff;font-size:16px}button{width:100%;margin-top:22px;padding:15px;border:0;border-radius:9px;background:#c6a56b;color:#111827;font-weight:bold;cursor:pointer}button:disabled{opacity:.6}.message{min-height:24px;font-size:13px;color:#e8c98f}.back{display:block;margin-top:18px;color:#e8c98f;text-align:center}
</style>
</head>
<body>
<main class="card">
<div class="mark">BP</div>
<div class="eyebrow">BELLA PARK · ACCOUNT SECURITY</div>
<h1>Tetapkan Password Baharu</h1>
<p>Masukkan password baharu untuk akaun staf kau. Gunakan sekurang-kurangnya 8 aksara.</p>
<form id="reset-form">
<label for="password">Password baharu</label>
<input id="password" type="password" minlength="8" autocomplete="new-password" required>
<label for="confirm">Sahkan password baharu</label>
<input id="confirm" type="password" minlength="8" autocomplete="new-password" required>
<button id="submit" type="submit">SIMPAN PASSWORD</button>
<p class="message" id="message" role="status"></p>
</form>
<a class="back" href="./">Kembali ke log masuk</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseClient=window.supabase.createClient("https://xudgvklvdonsyjeendkj.supabase.co","sb_publishable_Q7mDg46N_FP9_bPdrsRSLQ_sJY28ppU");
const form=document.getElementById("reset-form"),button=document.getElementById("submit"),message=document.getElementById("message");
(async()=>{
  const hash=new URLSearchParams(location.hash.slice(1));
  const accessToken=hash.get("access_token"),refreshToken=hash.get("refresh_token");
  if(accessToken&&refreshToken){
    const {error}=await supabaseClient.auth.setSession({access_token:accessToken,refresh_token:refreshToken});
    if(error){message.textContent="Pautan reset tidak sah atau sudah tamat tempoh. Minta pautan baharu.";form.hidden=true;}
    history.replaceState(null,"",location.pathname);
  } else {
    const {data:{session}}=await supabaseClient.auth.getSession();
    if(!session){message.textContent="Sesi reset tiada. Minta email reset password yang baharu.";form.hidden=true;}
  }
})();
form.addEventListener("submit",async e=>{
  e.preventDefault();const password=document.getElementById("password").value,confirm=document.getElementById("confirm").value;
  if(password.length<8){message.textContent="Password mesti sekurang-kurangnya 8 aksara.";return;}
  if(password!==confirm){message.textContent="Pengesahan password tidak sepadan.";return;}
  button.disabled=true;button.textContent="MENYIMPAN...";
  const {error}=await supabaseClient.auth.updateUser({password});
  if(error){message.textContent=error.message;button.disabled=false;button.textContent="SIMPAN PASSWORD";return;}
  await supabaseClient.auth.signOut();
  form.hidden=true;message.textContent="Password berjaya dikemaskini. Kau boleh log masuk menggunakan username norizwan dan password baharu.";
});
</script>
</body>
</html>

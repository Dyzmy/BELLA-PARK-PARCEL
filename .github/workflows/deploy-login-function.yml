name: Deploy BELLA PARK Supabase functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-login-function.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: xudgvklvdonsyjeendkj
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - name: Deploy login function
        run: supabase functions deploy login-by-username --project-ref "$PROJECT_ID" --use-api --yes
      - name: Deploy protected creator password reset
        run: supabase functions deploy admin-reset-creator-password --project-ref "$PROJECT_ID" --use-api --yes
      - name: Deploy admin rider account management
        run: supabase functions deploy admin-manage-riders --project-ref "$PROJECT_ID" --use-api --yes

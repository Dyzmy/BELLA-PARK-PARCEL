name: Deploy BELLA PARK login function

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/login-by-username/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-login-function.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: xudgvklvdonsyjeendkj
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy login-by-username
        run: supabase functions deploy login-by-username --project-ref "$PROJECT_ID" --use-api --yes
